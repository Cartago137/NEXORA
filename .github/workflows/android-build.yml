name: Android build

on:
  pull_request:
    branches: [main, recovery/stable-launch-shell]
  push:
    branches: [main, recovery/stable-launch-shell, feature/multi-game-playback]
  workflow_dispatch:

# Keep only the newest build for each branch/PR ref. This avoids a backlog of
# redundant APK builds while the native mGBA dependency is compiling.
concurrency:
  group: nexora-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android build components
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
          # Android SDK publishes API 37 under android-37.0; AGP resolves compileSdk 37 by android-37.
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"; fi

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexora-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
