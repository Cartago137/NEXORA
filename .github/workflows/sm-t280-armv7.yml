name: SM-T280 ARMv7 compatibility

on:
  push:
    branches:
      - experiment/sm-t280-armv7
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  armv7-debug:
    name: Build and inspect ARMv7 APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK (including armeabi-v7a)
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Verify ARMv7 native libraries are packaged
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -l "$APK" | tee apk-contents.txt
          grep -q 'lib/armeabi-v7a/libnexora_native.so' apk-contents.txt
          grep -q 'lib/armeabi-v7a/libmgba.so' apk-contents.txt

      - name: Upload experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: nexora-sm-t280-armv7-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
